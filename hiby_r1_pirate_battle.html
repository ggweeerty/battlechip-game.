<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Морской бой — HiBy R1</title>
<style>
*{box-sizing:border-box;touch-action:manipulation}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061522;color:#eef7fb;font-family:system-ui,Arial,sans-serif}
#app{height:100dvh;width:100vw;display:flex;flex-direction:column;gap:5px;padding:6px;max-width:480px;margin:auto}
#stats{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;flex:0 0 auto}
.stat{background:#102b3d;border:1px solid #31536a;border-radius:7px;text-align:center;padding:4px 2px;font-size:11px}
.stat b{display:block;font-size:17px}
#bossline{display:flex;justify-content:space-between;font-size:11px;padding:0 3px}
#hpwrap{height:6px;background:#34495a;border-radius:8px;overflow:hidden;flex:0 0 auto}
#hp{height:100%;width:100%;background:#eab64d}
#gamewrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
canvas{display:block;height:100%;width:auto;max-width:100%;aspect-ratio:480/800;object-fit:contain;background:#092b40;border:1px solid #31536a;border-radius:5px}
#controls{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:6px;flex:0 0 auto}
button{border:1px solid #56819a;border-radius:8px;background:#17435a;color:white;font-size:16px;font-weight:700;padding:12px 3px;min-height:48px}
button:active{background:#28718d}
#info{font-size:10px;display:flex;justify-content:space-between;color:#b9d0dc;flex:0 0 auto}
#message{font-size:11px;text-align:center;min-height:16px;color:#ffd88c;flex:0 0 auto}
#bottom{display:flex;gap:6px;flex:0 0 auto}
#bottom button{flex:1;font-size:12px;min-height:36px;padding:7px}
@media (orientation:landscape){#app{max-width:100vw;flex-direction:row;flex-wrap:wrap;align-items:stretch}#stats{width:100%}#bossline,#hpwrap{width:100%}#gamewrap{height:calc(100dvh - 145px);flex:1}#controls{width:120px;display:flex;flex-direction:column;justify-content:center}#info,#message,#bottom{width:100%}}
</style>
</head>
<body>
<div id="app">
 <div id="stats">
  <div class="stat">УРОВЕНЬ<b id="level">1</b></div>
  <div class="stat">СЧЁТ<b id="score">0</b></div>
  <div class="stat">ЖИЗНИ<b id="lives">3</b></div>
 </div>
 <div id="bossline"><span id="bossname">Чёрный галеон</span><span id="hptext">Прочность: 100%</span></div>
 <div id="hpwrap"><div id="hp"></div></div>
 <div id="gamewrap"><canvas id="game" width="480" height="800"></canvas></div>
 <div id="controls">
  <button id="left">◀</button><button id="fire">🔥 ОГОНЬ</button><button id="right">▶</button>
 </div>
 <div id="info"><span id="weapons">Прямые: 1 · Веер: 0</span><span id="boost">Бустов нет</span></div>
 <div id="message">Разрушай секции и лови редкие усиления!</div>
 <div id="bottom"><button id="restart">ЗАНОВО</button><button id="pause">ПАУЗА</button></div>
</div>
<script>
(()=> {
const $=id=>document.getElementById(id), canvas=$('game'),ctx=canvas.getContext('2d');
const W=480,H=800,names=['Чёрный галеон','Королевский фрегат','Алый корсар','Призрачный линкор','Железный дредноут','Штормовой разрушитель'];
const colors=['#35485b','#b18a43','#a83d3d','#9294b5','#71818b','#348d91'];
let player={x:240,y:735},boss=null,shots=[],enemy=[],drops=[],fx=[],level=1,score=0,lives=3,weapon=1,spread=0,paused=false,over=false,last=0,fireAt=0,nextBossAt=0,held={left:false,right:false,fire:false},keys={};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),say=s=>$('message').textContent=s;
function newBoss(){let hp=3+Math.floor(level*.65);boss={x:240,y:165,dir:Math.random()<.5?1:-1,speed:.42+Math.min(level*.095,1.5),parts:Array.from({length:7},(_,i)=>({x:(i-3)*36,hp,max:hp,alive:true})),fire:0,skin:(level-1)%colors.length,dropped:false};$('bossname').textContent=names[boss.skin];say('Босс уровня '+level+' вступает в бой!')}
function burst(x,y,col){for(let i=0;i<10;i++)fx.push({x,y,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4,life:24,col})}
function shoot(){for(let i=0;i<weapon;i++){let dx=(i-(weapon-1)/2)*Math.min(24,10+weapon*1.5);shots.push({x:player.x+dx,y:player.y-27,vx:0,vy:-9})}for(let j=1;j<=spread;j++){let a=.22+j*.11;shots.push({x:player.x,y:player.y-27,vx:-a,vy:-8},{x:player.x,y:player.y-27,vx:a,vy:-8})}}
function ship(x,y,s,col){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='#142330';ctx.fillRect(-37,-8,74,22);ctx.fillStyle=col;ctx.fillRect(-34,-14,68,20);ctx.fillStyle='#d6c08d';ctx.fillRect(-27,-20,54,6);ctx.fillStyle='#6b4935';ctx.fillRect(-4,-44,6,29);ctx.fillRect(15,-33,5,20);ctx.fillRect(-20,-33,5,20);ctx.fillStyle='#eee0bd';ctx.fillRect(-18,-40,31,11);ctx.fillRect(-15,-27,22,6);ctx.restore()}
function draw(){
 ctx.fillStyle='#092b40';ctx.fillRect(0,0,W,H);
 for(let i=0;i<65;i++){let x=i*79%W,y=(i*113+performance.now()*.025)%H;ctx.fillStyle=i%2?'#16445a':'#123950';ctx.fillRect(x,y,3,10)}
 if(boss){ctx.save();ctx.translate(boss.x,boss.y);ctx.fillStyle='#17232d';ctx.fillRect(-145,-24,290,52);ctx.fillStyle=colors[boss.skin];ctx.fillRect(-138,-31,276,43);ctx.fillStyle='#b8a27b';ctx.fillRect(-112,-40,224,10);ctx.fillStyle='#e2d3aa';ctx.fillRect(-55,-52,110,15);ctx.fillStyle='#6c4b32';ctx.fillRect(-6,-76,10,38);ctx.fillRect(-80,-62,8,32);ctx.fillRect(72,-62,8,32);
 boss.parts.forEach(p=>{if(!p.alive)return;ctx.fillStyle='#202c35';ctx.fillRect(p.x-14,-19,28,27);ctx.fillStyle=p.hp===1?'#e36d45':'#e1bd72';ctx.fillRect(p.x-10,-30,20,12);ctx.fillStyle='#513b2b';ctx.fillRect(p.x-3,-40,6,12)});ctx.restore()}
 ship(player.x,player.y,.9,'#55a8c5');
 shots.forEach(s=>{ctx.fillStyle='#ffe7a1';ctx.fillRect(s.x-3,s.y-9,6,15)});
 enemy.forEach(s=>{ctx.fillStyle='#ff795a';ctx.fillRect(s.x-4,s.y-6,8,13)});
 drops.forEach(d=>{ctx.fillStyle=d.type===0?'#4bd6e5':'#ffba52';ctx.fillRect(d.x-13,d.y-13,26,26);ctx.fillStyle='#092b40';ctx.font='bold 20px monospace';ctx.fillText(d.type===0?'×':'✦',d.x-7,d.y+7)});
 fx.forEach(p=>{ctx.fillStyle=p.col;ctx.fillRect(p.x,p.y,4,4)});
}
function ui(){$('level').textContent=level;$('score').textContent=score;$('lives').textContent=lives;if(boss){let max=boss.parts.reduce((a,p)=>a+p.max,0),hp=boss.parts.reduce((a,p)=>a+p.hp,0),v=Math.ceil(hp/max*100);$('hptext').textContent='Прочность: '+v+'%';$('hp').style.width=v+'%'}else{$('hptext').textContent='Следующий босс...';$('hp').style.width='0%'}$('weapons').textContent='Прямые: '+weapon+' · Веер: '+spread;$('boost').textContent=weapon>1||spread>0?'Усиление активно':'Бустов нет'}
function frame(t){if(!last)last=t;let dt=Math.min(35,t-last);last=t;
 if(!paused&&!over){
 let dir=(held.left||keys.ArrowLeft?-1:0)+(held.right||keys.ArrowRight?1:0);player.x=clamp(player.x+dir*dt*.32,24,456);
 if((held.fire||keys[' '])&&t-fireAt>Math.max(125,270-weapon*17)){shoot();fireAt=t}
 if(boss){boss.x+=boss.dir*boss.speed*dt*.06;if(boss.x>330){boss.x=330;boss.dir=-1}if(boss.x<150){boss.x=150;boss.dir=1}if(Math.random()<.007+level*.0007)boss.dir*=-1;boss.fire+=dt;
 if(boss.fire>Math.max(800,1850-level*45)){boss.fire=0;if(Math.random()<.65)enemy.push({x:boss.x+(Math.random()-.5)*170,y:boss.y+20,vx:(player.x-boss.x)*.0017,vy:2.4+level*.1});else for(let j=-1;j<=1;j++)enemy.push({x:boss.x+j*48,y:boss.y+20,vx:j*.8,vy:2.4+level*.1})}}
 else if(nextBossAt&&t>=nextBossAt){nextBossAt=0;newBoss()}
 shots.forEach(s=>{s.x+=s.vx;s.y+=s.vy});shots=shots.filter(s=>s.y>-20&&s.x>-15&&s.x<W+15);
 if(boss)for(let s of shots){for(let p of boss.parts){if(p.alive&&Math.abs(s.x-(boss.x+p.x))<17&&Math.abs(s.y-(boss.y-19))<28){s.y=-40;p.hp--;burst(boss.x+p.x,boss.y,'#ffcb75');if(p.hp<=0){p.alive=false;score+=100;burst(boss.x+p.x,boss.y,'#ff9b56');if(!boss.dropped&&drops.length===0&&Math.random()<.15){drops.push({x:clamp(boss.x+p.x,16,464),y:boss.y+20,type:Math.random()<.5?0:1});boss.dropped=true;say('Редкий буст! Лови его!')}}break}}}
 enemy.forEach(s=>{s.x+=s.vx;s.y+=s.vy;if(Math.abs(s.x-player.x)<17&&Math.abs(s.y-player.y)<22){s.y=H+40;lives--;burst(player.x,player.y,'#ff715b');if(lives<=0){over=true;say('Корабль уничтожен! Нажми «Заново».')}else say('Попадание! Осталось жизней: '+lives)}});enemy=enemy.filter(s=>s.y<H+20);
 drops.forEach(d=>{d.y+=dt*.12;if(Math.abs(d.x-player.x)<25&&Math.abs(d.y-player.y)<28){if(d.type===0){weapon=Math.min(7,weapon+1);say('Буст: больше прямых снарядов!')}else{spread=Math.min(5,spread+1);say('Буст: широкий веер!')}d.y=H+60;burst(player.x,player.y,'#70e5ed')}});drops=drops.filter(d=>d.y<H+20);
 if(boss&&boss.parts.every(p=>!p.alive)){score+=500;burst(boss.x,boss.y,'#f5c66a');boss=null;level++;nextBossAt=t+1000;say('Победа! Следующий босс уже на подходе!')}
 fx.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life--});fx=fx.filter(p=>p.life>0);
 }
 ui();draw();requestAnimationFrame(frame)}
function start(){level=1;score=0;lives=3;weapon=1;spread=0;shots=[];enemy=[];drops=[];fx=[];player.x=240;boss=null;over=false;paused=false;nextBossAt=0;newBoss();ui();$('pause').textContent='ПАУЗА';last=performance.now()}
function bind(id,k){let el=$(id);el.addEventListener('pointerdown',e=>{e.preventDefault();held[k]=true;el.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>el.addEventListener(ev,()=>held[k]=false))}
bind('left','left');bind('right','right');bind('fire','fire');
$('restart').onclick=start;$('pause').onclick=()=>{if(over)return;paused=!paused;$('pause').textContent=paused?'ПРОДОЛЖИТЬ':'ПАУЗА';last=performance.now()};
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' '].includes(e.key)){keys[e.key]=true;e.preventDefault()}});window.addEventListener('keyup',e=>keys[e.key]=false);
start();requestAnimationFrame(frame);
})();
</script>
</body></html>
