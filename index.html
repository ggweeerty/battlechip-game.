<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>Battlechip — Pirate Battle</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06101d;color:#eaf6ff;font-family:system-ui,-apple-system,sans-serif;touch-action:none}
#wrap{height:100dvh;display:flex;flex-direction:column;max-width:620px;margin:auto;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom)}
header{height:48px;display:flex;align-items:center;justify-content:space-between;font-weight:800;letter-spacing:.08em;color:#8de8ff}
#stats{font-size:13px;color:#c4d7e8}canvas{display:block;width:100%;flex:1;min-height:0;background:linear-gradient(#081a2c,#06101d);border:1px solid #23435c;border-radius:14px}
#controls{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:8px;padding:9px 0 4px}
button{border:1px solid #37617c;border-radius:13px;background:#102b42;color:white;font-size:18px;font-weight:800;min-height:54px;touch-action:none}
button:active{background:#1d5572}#fire{background:#15516a;border-color:#50c9ed}
#hint{text-align:center;font-size:11px;color:#7896aa;padding:2px 0 5px}
#overlay{position:fixed;inset:0;background:#020914df;display:flex;align-items:center;justify-content:center;padding:24px}
.panel{max-width:340px;width:100%;text-align:center;background:#0c2033;border:1px solid #37617c;border-radius:20px;padding:24px;box-shadow:0 15px 60px #0009}
.panel h1{margin:0 0 8px;color:#8de8ff}.panel p{color:#b8cada;line-height:1.45}.panel button{width:100%;margin-top:12px}
.hidden{display:none}
</style>
</head>
<body>
<div id="wrap">
<header><span>⚓ BATTLECHIP</span><span id="stats">УРОВЕНЬ 1 · ОЧКИ 0</span></header>
<canvas id="game"></canvas>
<div id="controls">
<button id="left">◀</button><button id="right">▶</button><button id="fire">ОГОНЬ</button>
</div>
<div id="hint">Двигай корабль и удерживай «ОГОНЬ». Усиления выпадают редко.</div>
</div>
<div id="overlay"><div class="panel"><h1>🏴‍☠️ PIRATE BATTLE</h1><p>Сразись с пиратскими боссами! Разрушай их секции, уклоняйся от залпов и собирай усиления.</p><button id="start">НАЧАТЬ БОЙ</button></div></div>
<script>
(()=>{
const c=document.getElementById('game'),ctx=c.getContext('2d'),stats=document.getElementById('stats'),overlay=document.getElementById('overlay');
let W=480,H=720,player,boss,shots=[],enemyShots=[],drops=[],particles=[],score=0,level=1,playing=false,fire=false,left=false,right=false,last=0,spawn=0;
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);c.width=Math.max(1,Math.floor(r.width*d));c.height=Math.max(1,Math.floor(r.height*d));W=c.width;H=c.height;ctx.setTransform(1,0,0,1,0,0)}
new ResizeObserver(resize).observe(c);resize();
function newBoss(){let hp=5+Math.min(level-1,8);boss={x:W/2,y:H*.18,w:Math.min(W*.48,220),h:Math.min(H*.12,76),hp,max:hp,phase:0,skin:level%4,dir:1,speed:(.55+level*.09)*(W/480),shot:0};}
function reset(){score=0;level=1;shots=[];enemyShots=[];drops=[];particles=[];player={x:W/2,y:H*.84,w:W*.09,h:H*.055,spread:1};newBoss();playing=true;overlay.classList.add('hidden');}
function rect(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(x,y,w,h)}
function drawShip(x,y,w,h,col){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x,y-h/2);ctx.lineTo(x+w/2,y+h/2);ctx.lineTo(x+w*.22,y+h*.35);ctx.lineTo(x-w*.22,y+h*.35);ctx.lineTo(x-w/2,y+h/2);ctx.closePath();ctx.fill();ctx.fillStyle='#c8f5ff';ctx.fillRect(x-w*.09,y-h*.1,w*.18,h*.28)}
function text(t,x,y,size,color='#eaf6ff'){ctx.fillStyle=color;ctx.font=`bold ${size}px system-ui`;ctx.textAlign='center';ctx.fillText(t,x,y)}
function draw(){ctx.clearRect(0,0,W,H);for(let i=0;i<55;i++){let x=(i*83)%W,y=(i*137+performance.now()*.018)%H;rect(x,y,2,2,'#31506a')}
if(boss){let col=['#9a4d42','#426e9a','#7d579f','#a47a35'][boss.skin];drawShip(boss.x,boss.y,boss.w,boss.h,col);for(let i=0;i<boss.max;i++){let bw=boss.w/boss.max;rect(boss.x-boss.w/2+i*bw+2,boss.y+boss.h*.15,bw-4,boss.h*.42,i<boss.hp?'#f4b85d':'#27384a')}text('BOSS '+level,boss.x,boss.y-boss.h*.72,14)}
drawShip(player.x,player.y,player.w,player.h,'#4bd3ed');
shots.forEach(s=>rect(s.x-3,s.y-10,6,14,'#9df5ff'));enemyShots.forEach(s=>{ctx.fillStyle='#ff795e';ctx.beginPath();ctx.arc(s.x,s.y,5,0,7);ctx.fill()});
drops.forEach(d=>{ctx.fillStyle=d.type===0?'#58d9ff':'#ffd15c';ctx.beginPath();ctx.arc(d.x,d.y,10,0,7);ctx.fill();text(d.type===0?'×':'✦',d.x,d.y+4,13,'#102333')});
particles.forEach(p=>{rect(p.x,p.y,3,3,p.col)});
}
function update(dt){if(!playing)return;let speed=W*.42*dt/1000;if(left)player.x-=speed;if(right)player.x+=speed;player.x=Math.max(player.w/2,Math.min(W-player.w/2,player.x));
if(fire){spawn-=dt;if(spawn<=0){for(let i=0;i<player.spread;i++){let offset=(i-(player.spread-1)/2)*W*.035;shots.push({x:player.x+offset,y:player.y-player.h/2})}spawn=210}}
shots.forEach(s=>s.y-=W*.75*dt/1000);shots=shots.filter(s=>s.y>-20);
if(boss){boss.phase+=dt;boss.x+=boss.dir*boss.speed*dt/16;if(boss.x>W-boss.w/2||boss.x<boss.w/2)boss.dir*=-1;boss.shot+=dt;if(boss.shot>Math.max(450,1200-level*55)){enemyShots.push({x:boss.x,y:boss.y+boss.h/2,vx:(player.x-boss.x)*.00018,vy:.22+level*.012});boss.shot=0}
for(let i=shots.length-1;i>=0;i--){let s=shots[i];if(s.y<boss.y+boss.h/2&&s.y>boss.y-boss.h/2&&Math.abs(s.x-boss.x)<boss.w/2){shots.splice(i,1);boss.hp--;score+=10;if(Math.random()<.035&&drops.length===0)drops.push({x:boss.x,y:boss.y,type:Math.random()<.65?0:1});if(boss.hp<=0){score+=100;level++;newBoss();enemyShots=[];break}}}}
enemyShots.forEach(s=>{s.x+=s.vx*dt;s.y+=s.vy*dt});enemyShots=enemyShots.filter(s=>s.y<H+20);
for(let i=drops.length-1;i>=0;i--){let d=drops[i];d.y+=.12*dt;if(Math.abs(d.x-player.x)<player.w*.65&&Math.abs(d.y-player.y)<player.h){player.spread=d.type===0?Math.min(5,player.spread+1):Math.min(5,player.spread+2);drops.splice(i,1)}else if(d.y>H)drops.splice(i,1)}
if(enemyShots.some(s=>Math.abs(s.x-player.x)<player.w*.45&&Math.abs(s.y-player.y)<player.h*.5)){playing=false;overlay.classList.remove('hidden');overlay.querySelector('h1').textContent='💥 КОРАБЛЬ ПОТОПЛЕН';overlay.querySelector('p').textContent=`Очки: ${score}. Достигнут уровень: ${level}. Попробуй ещё раз!`;overlay.querySelector('button').textContent='ИГРАТЬ СНОВА'}
stats.textContent=`УРОВЕНЬ ${level} · ОЧКИ ${score} · ЗАЛП ${player.spread}`}
function loop(t){let dt=Math.min(40,t-last||16);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
function hold(id,fn){let b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();fn(true)});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>fn(false)))}
hold('left',v=>left=v);hold('right',v=>right=v);hold('fire',v=>fire=v);
document.getElementById('start').onclick=reset;
})();
</script>
</body></html>
